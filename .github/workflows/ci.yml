name: CPU CI

on:
  push:
  pull_request:

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The validated path: the pinned lock file, exercised end to end. A green
  # tick here means the locked environment actually works, not that some
  # freely resolved environment happened to work today.
  locked:
    name: Locked environment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Record the dependency lock hash
        run: |
          sha256sum requirements-lock.txt | tee lock-hash.txt

      - name: Install the locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Verify the installed set matches the lock exactly
        run: python tools/check_lock.py

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Static type check
        run: python -m mypy

      - name: Tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -t . -v
          python -m coverage report
          python -m coverage xml

      - name: Canonical specification identity
        run: python -m aaa.cli spec-hash

      - name: Observation-noise protocol identity
        run: python -m aaa.cli observation-noise-protocol-hash

      - name: Observation-noise development smoke
        run: |
          python -m aaa.cli observation-noise --role development --quick \
            --attempt-label ci-observation-noise --output-root "${RUNNER_TEMP}/aaa-noise-runs"
          python -m aaa.cli observation-noise-recompute \
            "${RUNNER_TEMP}/aaa-noise-runs/observation-noise-v1_1/ci-observation-noise"

      - name: Development benchmark smoke
        run: |
          python -m aaa.cli benchmark --role development --attempt-label ci-smoke \
            --replicas 2 --episodes 2 --output-root "${RUNNER_TEMP}/aaa-runs"

      - name: Recompute every metric and gate from the retained raw evidence
        run: |
          python -m aaa.cli recompute "${RUNNER_TEMP}/aaa-runs/benchmark-v2_1/ci-smoke"

      - name: Historical v1 smoke
        run: python -m aaa.cli smoke --output-root "${RUNNER_TEMP}/aaa-v1-runs"

      - name: Confirmation exit-code contract
        run: python tools/check_exit_codes.py

      - name: Retain failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-locked-evidence
          path: |
            ${{ runner.temp }}/aaa-runs
            ${{ runner.temp }}/aaa-noise-runs
            coverage.xml
            lock-hash.txt
          retention-days: 14
          if-no-files-found: warn

  # Every Python version advertised in pyproject.toml classifiers. Do not add a
  # version here without adding the classifier, or the reverse.
  versions:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -t .

  # A fresh install from a built wheel, run from a directory that is not the
  # repository, so a repository-relative resource path cannot pass by accident.
  fresh-install:
    name: Fresh install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build with the locked backend and install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_lock.py
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
      - name: Use the installed package from an unrelated directory
        run: |
          mkdir -p "${RUNNER_TEMP}/elsewhere"
          cd "${RUNNER_TEMP}/elsewhere"
          aaa spec-hash
          python -c "
          from aaa.benchmark.spec import canonical_spec_path, load_spec
          path = canonical_spec_path()
          assert path.is_file(), path
          print('packaged specification:', path)
          print('version:', load_spec().spec_version)
          "
          aaa observation-noise-protocol-hash
          aaa benchmark --role development --attempt-label installed \
            --replicas 1 --episodes 1 --output-root "${RUNNER_TEMP}/elsewhere/runs"
          aaa recompute "${RUNNER_TEMP}/elsewhere/runs/benchmark-v2_1/installed"
          aaa observation-noise --role development --quick \
            --attempt-label installed-noise --output-root "${RUNNER_TEMP}/elsewhere/noise-runs"
          aaa observation-noise-recompute \
            "${RUNNER_TEMP}/elsewhere/noise-runs/observation-noise-v1_1/installed-noise"

      - name: Retain fresh-install failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-fresh-install-evidence
          path: |
            ${{ runner.temp }}/elsewhere/runs
            ${{ runner.temp }}/elsewhere/noise-runs
          retention-days: 14
          if-no-files-found: warn
